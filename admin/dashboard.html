<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard — FoodShare</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/css/style.css" />
<link rel="stylesheet" href="../assets/css/responsive.css" />
<link rel="stylesheet" href="../assets/css/dashboard.css" />
</head>
<body>

<header class="navbar">
  <div class="container navbar__inner">
    <a href="../index.html" class="navbar__brand">
      <span class="navbar__brand-mark" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 3C7 3 4 7 4 12c0 4 3 7 3 7h10s3-3 3-7c0-5-3-9-8-9Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 3v16" stroke="currentColor" stroke-width="2"/></svg>
      </span>
      FoodShare
    </a>
    <div class="navbar__actions">
      <span class="badge badge--cancelled" style="color: var(--color-ink-soft);">Admin</span>
      <button class="btn btn--outline btn--sm" onclick="logout()">Log out</button>
    </div>
  </div>
</header>

<main class="dashboard-placeholder">
  <div class="card dashboard-placeholder__card">
    <span class="badge badge--pending dashboard-placeholder__badge">Coming in Phase 5</span>
    <h2>Admin dashboard</h2>
    <p id="welcome-line" class="text-muted">You're signed in for this demo. The full admin dashboard — users, donations, waste logs, audit logs, and reports — is built in the next phase.</p>
    <a href="../login.html" class="btn btn--outline">Back to login</a>
  </div>
</main>

<script src="../assets/js/mock-data.js"></script>
<script src="../assets/js/auth-demo.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  const session = getSession();
  if (session) {
    document.getElementById("welcome-line").textContent =
      `Welcome, ${session.name}. You're signed in for this demo. The full admin dashboard — users, donations, waste logs, audit logs, and reports — is built in the next phase.`;
  }
</script>
</body>
</html>
